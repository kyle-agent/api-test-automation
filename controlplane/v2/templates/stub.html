{% extends "base.html" %}
{% block title %}{{ stub_title }}{% endblock %}
{% block content %}
<h1 class="page-q">{{ stub_title }}</h1>
<section class="panel">
  <p class="stub-desc">{{ stub_desc }}</p>
  <p class="panel-note">이 축은 화면 단위로 순차 구축됩니다. 그때까지는 기존 화면을 이용하세요:</p>
  <ul class="stub-links">
    {% for label, href in stub_links %}
    <li><a href="{{ href }}">{{ label }} →</a></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
