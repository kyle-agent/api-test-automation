name: Chat heavy (push-triggered, cancellable)

# Dedicated CHAT-DRIVEN heavy run that a Claude session can CREATE and STOP using
# only `git push` — no workflow_dispatch (the MCP/integration token gets 403) and
# no hosted control plane. Runs on GitHub's own runners, so it egresses on
# GitHub's network, NOT the Claude-remote container's transparent proxy — i.e. it
# does NOT hit the egress-proxy 503 storm that makes in-container heavy runs
# unreliable (knowledge/validated-facts.md, 2026-06-20).
#
# CREATE:  edit .github/chat-heavy-request -> `action=run`  (+ gate/filter lines) -> push
# STOP:    edit .github/chat-heavy-request -> `action=stop` -> push
#          (the `concurrency` block cancels the in-flight run; this stop-run then
#           runs the reconciler sweep so nothing leaks)
#
# The control file is KEY=VALUE (parsed below): action, mutations, destructive,
# heavy, crud_filter, category, service. Initial `action=noop` is a harmless no-op
# (exits before any SCP call or sweep) so adding this workflow never starts a run.
on:
  push:
    paths: [".github/chat-heavy-request"]

# Only ONE chat-heavy run at a time; a new push (e.g. action=stop) CANCELS the
# in-flight one — this is the git-only "stop" lever.
concurrency:
  group: chat-heavy
  cancel-in-progress: true

env:
  SCP_REGION: ${{ vars.SCP_REGION || 'kr-west1' }}
  SCP_ENV: ${{ vars.SCP_ENV || 'e' }}
  SCP_HOST_TEMPLATE: ${{ vars.SCP_HOST_TEMPLATE }}
  SCP_SERVICE_HOSTS: ${{ vars.SCP_SERVICE_HOSTS }}
  SCP_BASE_URL: ${{ secrets.SCP_BASE_URL }}
  SCP_ACCESS_KEY: ${{ secrets.SCP_ACCESS_KEY }}
  SCP_SECRET_KEY: ${{ secrets.SCP_SECRET_KEY }}
  SCP_PROJECT_ID: ${{ secrets.SCP_PROJECT_ID }}
  SCP_AUTH_SCHEME: ${{ vars.SCP_AUTH_SCHEME || 'hmac' }}
  SCP_TIMEOUT: ${{ vars.SCP_TIMEOUT || '20' }}
  SCP_MAX_RETRIES: ${{ vars.SCP_MAX_RETRIES || '2' }}
  PYTHONPATH: ${{ github.workspace }}
  APITEST_RUN_ID: gha-chatheavy-${{ github.run_id }}

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Parse control file
        id: req
        run: |
          F=.github/chat-heavy-request
          get() { grep -E "^$1=" "$F" | head -1 | cut -d= -f2- | tr -d '"' | xargs || true; }
          echo "action=$(get action)"        >> "$GITHUB_OUTPUT"
          echo "mutations=$(get mutations)"   >> "$GITHUB_OUTPUT"
          echo "destructive=$(get destructive)">> "$GITHUB_OUTPUT"
          echo "heavy=$(get heavy)"           >> "$GITHUB_OUTPUT"
          echo "crud_filter=$(get crud_filter)">> "$GITHUB_OUTPUT"
          echo "category=$(get category)"     >> "$GITHUB_OUTPUT"
          echo "service=$(get service)"       >> "$GITHUB_OUTPUT"
          echo "parallel=$(get parallel)"     >> "$GITHUB_OUTPUT"
          echo "----- chat-heavy-request -----"; cat "$F" || true

      - name: No-op / stop (skip the heavy work)
        if: steps.req.outputs.action != 'run'
        run: echo "action='${{ steps.req.outputs.action }}' — not 'run'; skipping heavy work (cleanup sweep still runs below)."

      - name: Setup Python + deps
        if: steps.req.outputs.action == 'run'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install
        if: steps.req.outputs.action == 'run'
        run: python -m pip install -r requirements.txt

      # Provision ONE shared VPC + subnet (api-test.yml's pattern) so xdist workers
      # ADOPT it instead of each self-creating — keeps -n safe under the 5-VPC cap.
      - name: Provision shared VPC + subnet (export for xdist adopt)
        if: steps.req.outputs.action == 'run'
        run: |
          for i in $(seq 1 8); do
            python -m regression.scenarios.shared_infra --provision > shared_ids.txt 2>/dev/null || true
            if grep -qE '^SCP_SHARED_VPC_ID=.+' shared_ids.txt; then
              grep -E '^SCP_SHARED_[A-Za-z0-9_]+=.+' shared_ids.txt >> "$GITHUB_ENV"
              echo "shared VPC provisioned (attempt $i):"; cat shared_ids.txt; break
            fi
            echo "provision attempt $i: no VPC id yet — retry in 30s"; sleep 30
          done

      # SAME engine as api-test.yml (pytest-xdist) — NO divergent driver. The
      # optimizations now live in SHARED code so this path gets them automatically:
      #   * longest-first ordering -> tests/crud/conftest.py (big DB/K8s lead the
      #     xdist distribution, so they start at t=0 instead of late);
      #   * warm per-host connection pool -> core.http_client.ApiClient.
      - name: Run heavy CRUD lifecycles (xdist — shared longest-first + warm pool)
        if: steps.req.outputs.action == 'run'
        env:
          SCP_ALLOW_MUTATIONS: ${{ steps.req.outputs.mutations || 'true' }}
          SCP_ALLOW_DESTRUCTIVE: ${{ steps.req.outputs.destructive || 'true' }}
          SCP_RUN_HEAVY: ${{ steps.req.outputs.heavy || 'true' }}
          SCP_CRUD_CATEGORY: ${{ steps.req.outputs.category }}
          SCP_CRUD_SERVICE: ${{ steps.req.outputs.service }}
          SCP_VPC_SHARED_RESERVED: '1'
        run: |
          K="${{ steps.req.outputs.crud_filter }}"
          N="${{ steps.req.outputs.parallel }}"; N="${N:-6}"
          ARGS="tests/crud -m crud -n $N -o addopts= -q"
          if [ -n "$K" ]; then
            python -m pytest $ARGS -k "$K" || true
          else
            python -m pytest $ARGS || true
          fi

      # ALWAYS reclaim our tag-scoped resources for a 'run' or 'stop' — on success,
      # on heavy failure, AND when this run was CANCELLED by a later action=stop push
      # (the stop lever). NEVER sweep on 'noop' (it would touch a concurrent run's
      # resources). 'stop' needs its own python/deps since the heavy steps were skipped.
      - name: Setup Python + deps (for stop-sweep)
        if: always() && steps.req.outputs.action == 'stop'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install (for stop-sweep)
        if: always() && steps.req.outputs.action == 'stop'
        run: python -m pip install -r requirements.txt
      - name: Reconciler sweep (tag-scoped cleanup)
        if: always() && (steps.req.outputs.action == 'run' || steps.req.outputs.action == 'stop')
        env:
          SCP_ALLOW_MUTATIONS: 'true'
          SCP_ALLOW_DESTRUCTIVE: 'true'
          SCP_SWEEP_NOWAIT: 'true'
        run: python -m cleanup.reconciler || true
