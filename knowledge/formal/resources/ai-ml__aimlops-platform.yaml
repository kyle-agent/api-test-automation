# Resource-task model — ai-ml/aimlops-platform (ai-ml group).
# Schema: docs/RESOURCE-MODEL-PLAN.md §1 · extracted from
# aimlops-platform-release-write-coverage (enabled, heavy, COVERAGE-ONLY —
# bodies NOT runtime-proven) + owner-provided domain knowledge in
# knowledge/formal/services/ai-ml__aimlops-platform.yaml (2026-06-11).
#
# Owner fact encoded here: the ske-cluster prerequisite has a REAL
# existing-or-create fork (§1's existing_or_create case) — branch ① references
# an existing cluster, branch ② provisions a NEW cluster inside the aimlops
# create and carries SKE's full closure + cost. Both branches are C4 targets.
version: 1
resources:
  aimlops-platform:
    code: "ai-ml-aimlops"
    service: ai-ml/aimlops-platform
    heavy: true
    requires:
      - {ref: ske-cluster, mode: existing_or_create}
    create:
      endpoint: "POST /v1/aimlops-platform"
      body:
        release_name: "regr-aimlops-{unique}"
        cluster_id: "{ske-cluster.cluster_id}"
        image_id: "{opt.image_id}"
        namespace: "regr-aimlops-{ualpha}"
        description: "API regression suite"
      options:
        image_id: {type: string, required: true,
                   note: "lookup — GET /v1/aimlops-platform/images. LIVE (run 27520649710): response wrapper is $.contents[] NOT $.images[]; item fields seen base_image (e.g. sdskubeflow-enterprise:1.9.2)/category(APP)/created_by(SYSTEM)/created_dt/description — id field assumed $.contents[0].id (truncated past the huge description HTML, unconfirmed)."}
    capture: {release_id: "$.id"}
    verify:
      - {name: read, endpoint: "GET /v1/aimlops-platform/{release_id}", expect_status: [200], optional: true,
         note: "id-bound show off release_id (getaimlopsplatformv1) — the only release_id-bound GET in the catalog. optional: a 4xx release POST yields no $.id -> literal {release_id} 404s harmlessly. UNPROVEN until first live 2xx (gen-heavy-aimlops wait-aimlops-release exercises it against the real release_id)."}
    delete: {endpoint: "DELETE /v1/aimlops-platform/{release_id}", destructive: true}
    provenance: docs
    cluster_precondition_reads: "Complete-lifecycle (FORMAT.md): aimlops-platform has 5 id-bound GETs that key off the ske-cluster PREREQUISITE's cluster_id (NOT release_id) — check-version, validate-namespaces, validate-resources, internal/.../nodes, internal/.../storageclasses — so they are precondition reads on the cluster, not verify reads on this node (the composer grafts verify off the node's OWN capture only). They are wired explicitly in the lifecycle JSONs: gen-heavy-aimlops hits them against the REAL RUNNING cluster_id (expect 200, tolerate 4xx); aimlops-platform-release-write-coverage hits them against a NONEXISTENT cluster_id literal via probe-cluster-preconditions (offline-safe coverage). coverage_gap = 0 (free-text doc key, see live_preconditions)."
    live_preconditions: "run 27520649710 (SKE closure all 2xx, cluster RUNNING): GET .../clusters/{id}/validate-namespaces 200; .../check-version 400; .../validate-resources 400; .../images 200 ($.contents[]); internal .../internal/clusters/{id}/nodes 404 + .../storageclasses 404 (internal path likely wrong or not exposed to this token). release POST not yet reached (blocked on image_id capture, fixed). Next run reaches release — its 4xx body will reveal the real required body (cpu/memory/storage_class/volume_size UNPROVEN)."
    source: {lifecycle: aimlops-platform-release-write-coverage,
             steps: [list-images, release-aimlops-platform, update-aimlops-platform,
                     delete-aimlops-platform]}
    notes: "'release' = AI/ML-Ops 플랫폼을 ske 클러스터 위에 프로비저닝 — billable·느림. 이 body 템플릿은 분기 ①(기존/선행 생성 클러스터 참조) 형상이다; 분기 ②(신규 클러스터를 aimlops create 안에서 함께 생성)의 body 형상은 미문서(docs JS-rendered, api_bodies 없음) — R3 라이브/콘솔 파생 과제이며 두 분기 모두 C4 변형 대상 (services/ai-ml__aimlops-platform.yaml aimlops-fork-is-c4-variation). 소스 lifecycle은 의도적으로 실생성하지 않는 coverage probe (release_id를 존재하지 않는 필드로 capture_soft → 404 보장)라 body(release_name/cluster_id/image_id/namespace 필드 세트 best-effort)/capture envelope $.id 모두 UNPROVEN(docs)."
